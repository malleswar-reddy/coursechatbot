services:
  backend:
    build: ./backend
    container_name: coursechatbot-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://localhost:5432/coursechatbot
      - SPRING_DATASOURCE_USERNAME=chatbot
      - SPRING_DATASOURCE_PASSWORD=chatbot_secret
      # Ollama is now running on the Dell server
      - OLLAMA_BASE_URL=http://localhost:11434
      - OLLAMA_MODEL=qwen2.5:0.5b
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: coursechatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
