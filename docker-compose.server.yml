services:

  backend:
    build: ./backend
    container_name: coursechatbot-backend
    ports:
      - "8000:8080"   # host:8000 → container:8080 (Spring Boot default)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: resolves to host IP → reaches Ollama + ChromaDB on host
    environment:
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-gemma3:4b}
      - OLLAMA_EMBED_MODEL=${OLLAMA_EMBED_MODEL:-nomic-embed-text}
      - CHROMA_BASE_URL=${CHROMA_BASE_URL:-http://host.docker.internal:8001}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Browser calls backend via Cloudflare tunnel — must be HTTPS (mixed content blocked otherwise)
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://hirevitae-chatbotapi.chakritech.org}
    container_name: coursechatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://hirevitae-chatbotapi.chakritech.org}
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    container_name: coursechatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    environment:
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_KEEP_ALIVE=30m
      - OLLAMA_NUM_THREAD=4
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: coursechatbot-chromadb
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/data          # ChromaDB saves to /data inside container
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/data
      - ANONYMIZED_TELEMETRY=FALSE
    restart: unless-stopped
    healthcheck:
      # ChromaDB image has Python but NOT curl — use Python for health check
      test: ["CMD", "python3", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/heartbeat').read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  ollama_data:
  chroma_data:
