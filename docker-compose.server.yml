services:
  postgres:
    image: postgres:16-alpine
    container_name: coursechatbot-postgres
    environment:
      POSTGRES_DB: coursechatbot
      POSTGRES_USER: chatbot
      POSTGRES_PASSWORD: chatbot_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chatbot -d coursechatbot"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: coursechatbot-backend
    ports:
      - "8000:8080"   # host:8000 → container:8080 (Spring Boot default)
    extra_hosts:
      - "host.docker.internal:host-gateway"   # Linux: resolves to host IP so we can reach host-side postgres
    environment:
      # Postgres runs on the host (or a different compose network) → reach it via host.docker.internal
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL:-jdbc:postgresql://host.docker.internal:5432/coursechatbot}
      - SPRING_R2DBC_URL=${SPRING_R2DBC_URL:-r2dbc:postgresql://host.docker.internal:5432/coursechatbot}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME:-chatbot}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD:-chatbot_secret}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:0.5b}
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        # Public server IP — browser calls backend at this URL
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://100.114.88.111:8000}
    container_name: coursechatbot-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://100.114.88.111:8000}
    depends_on:
      - backend
    restart: unless-stopped

  ollama:
    image: ollama/ollama
    container_name: coursechatbot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: coursechatbot-webui
    ports:
      - "3001:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_started
    restart: unless-stopped
    volumes:
      - open_webui_data:/app/backend/data

volumes:
  postgres_data:
  ollama_data:
  open_webui_data:
