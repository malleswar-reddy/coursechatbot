# Spring Boot application configuration
spring.application.name=coursechatbot-backend

# PostgreSQL datasource
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coursechatbot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chatbot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chatbot_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Ollama LLM configuration
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT:600}
ollama.num-predict=${OLLAMA_NUM_PREDICT:250}

# Server
server.port=8080

# Actuator
management.endpoints.web.exposure.include=health,info

# Connection pool tuning ? keep connections alive
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.maximum-pool-size=5
