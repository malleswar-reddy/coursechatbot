# =============================================================================
# CourseChatbot Backend - Application Configuration
# Environment variables override every default shown here.
# =============================================================================

spring.application.name=coursechatbot-backend

# -----------------------------------------------------------------------------
# Startup optimisations
# -----------------------------------------------------------------------------
# Defer bean creation to first use (~40% faster startup)
spring.main.lazy-initialization=true
# Skip ASCII banner
spring.main.banner-mode=off
# Disable JMX (not needed, saves ~100 ms)
spring.jmx.enabled=false
# This enables Virtual Threads for all incoming Web requests
spring.threads.virtual.enabled=true

# -----------------------------------------------------------------------------
# Flyway + JDBC + R2DBC — all disabled (no PostgreSQL; using ChromaDB only)
# -----------------------------------------------------------------------------
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,\
  org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# -----------------------------------------------------------------------------
# Ollama LLM
# Override via: OLLAMA_BASE_URL, OLLAMA_MODEL, OLLAMA_TIMEOUT, OLLAMA_NUM_PREDICT
# -----------------------------------------------------------------------------
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:gemma3:4b}
ollama.embedding-model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
ollama.timeout-seconds=${OLLAMA_TIMEOUT:600}
ollama.num-predict=${OLLAMA_NUM_PREDICT:400}

# -----------------------------------------------------------------------------
# ChromaDB — Vector store for course content
# -----------------------------------------------------------------------------
chroma.base-url=${CHROMA_BASE_URL:http://localhost:8001}
chroma.top-k=${CHROMA_TOP_K:3}

# -----------------------------------------------------------------------------
# Server ? Netty (WebFlux)
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# Actuator
# -----------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
