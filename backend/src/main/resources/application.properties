# Spring Boot application configuration
spring.application.name=coursechatbot-backend

# ?? Startup optimisations ?????????????????????????????????????????????????????
# Defer bean creation to first use (~40% faster startup)
spring.main.lazy-initialization=true
# Skip ASCII banner print
spring.main.banner-mode=off
# No JMX = one less subsystem to initialise
spring.jmx.enabled=false

# ?? R2DBC (reactive database access) ????????????????????????????????????????
spring.r2dbc.url=${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:5432/coursechatbot}
spring.r2dbc.username=${SPRING_DATASOURCE_USERNAME:chatbot}
spring.r2dbc.password=${SPRING_DATASOURCE_PASSWORD:chatbot_secret}
# Start pool small ? grows on demand; avoids creating 10 connections at boot
spring.r2dbc.pool.initial-size=2
spring.r2dbc.pool.max-size=10
spring.r2dbc.pool.max-idle-time=30m

# ?? JDBC DataSource ? used ONLY by Flyway for schema migrations ??????????????
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/coursechatbot}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:chatbot}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:chatbot_secret}
spring.datasource.driver-class-name=org.postgresql.Driver
# Flyway only needs 1 connection briefly ? keep Hikari pool tiny
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-timeout=10000

# ?? Flyway ???????????????????????????????????????????????????????????????????
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ?? Ollama LLM configuration ?????????????????????????????????????????????????
ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
ollama.model=${OLLAMA_MODEL:qwen2.5:0.5b}
ollama.timeout-seconds=${OLLAMA_TIMEOUT:600}
ollama.num-predict=${OLLAMA_NUM_PREDICT:250}

# ?? Server (Netty via WebFlux) ????????????????????????????????????????????????
server.port=8080

# ?? Actuator ?????????????????????????????????????????????????????????????????
management.endpoints.web.exposure.include=health,info
